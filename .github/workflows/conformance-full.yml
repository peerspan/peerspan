name: Conformance (full)

# The second tier (DEC-OWN15): the per-section guided onboarding suites, the
# runtime task suites and the peerbox suites. It
# runs nightly, by hand, and on a pull request labelled full-conformance; the
# per-push tier is conformance.yml. The installed bundle, upgrade and
# participant checks run locally with scripts/installed-acceptance.sh
# (DEC-OWN18).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # A pull request opened with the label sends labeled as well as opened, so
  # opened is left out: one run per event, not one cancelled and one complete.
  pull_request:
    types: [synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: conformance-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-conformance')
    name: Build host, peer probe and helper
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: |
          set -euo pipefail
          cargo build --locked --bin peerspan-host --bin peerspan-peer-probe --bin peerspan-helper
          mkdir -p bin
          cp target/debug/peerspan-host target/debug/peerspan-peer-probe target/debug/peerspan-helper bin/
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-binaries
          path: bin/
          retention-days: 1
          if-no-files-found: error

  suite:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-conformance')
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [sync, completion_rate_limit, project_onboarding, adapter_onboarding, invitation_onboarding, join_onboarding, owner_onboarding, owner_signing, admission_onboarding, admission_consent, admission_retained_prefix, incoming_progress, owner_finalization, owner_finalization_signing, requester_commit, requester_completion, access_onboarding, access_consent, access_signing, access_application, readiness, peer_reachability, machine_owner, machine_owner_consent, machine_return_prepare, machine_owner_signing, machine_requester_inspection, machine_requester_consent, machine_requester_completion, runtime, runtime_policy, runtime_renewal, runtime_runs, runtime_results, runtime_peerfs, runtime_agents, wide_contacts, peerbox, peerbox_runs, peerbox_agents, peerfs_local, peerfs_activation]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resource-helper test dependencies
        if: matrix.suite == 'machine_return_prepare'
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: -r conformance/slim/resource_mailbox_gate.requirements.txt
      # The MCP run_task cases drive the claude-channel adapter; without its SDK
      # they skip, and a skip passes.
      - uses: actions/setup-node@v4
        if: matrix.suite == 'runtime_results' || matrix.suite == 'runtime_peerfs' || matrix.suite == 'peerbox_agents'
        with:
          node-version: '24'
      - name: Install claude-channel adapter dependencies
        if: matrix.suite == 'runtime_results' || matrix.suite == 'runtime_peerfs' || matrix.suite == 'peerbox_agents'
        run: npm ci --prefix integrations/claude-channel --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: conformance-binaries
          path: bin
      - name: Run ${{ matrix.suite }}
        run: |
          set -euo pipefail
          chmod +x bin/*
          if [ '${{ matrix.suite }}' = 'machine_requester_inspection' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/inspection_finalization_diagnostic.py --bin bin
          elif [ '${{ matrix.suite }}' = 'owner_onboarding' ] || [ '${{ matrix.suite }}' = 'owner_signing' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/owner_publication_prerequisite.py '${{ matrix.suite }}' --bin bin
          elif [ '${{ matrix.suite }}' = 'join_onboarding' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/join_onboarding_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'requester_commit' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/requester_commit_prefix_diagnostic.py --bin bin
          elif [ '${{ matrix.suite }}' = 'requester_completion' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/requester_completion_barrier_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'machine_requester_consent' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/machine_requester_consent_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'access_onboarding' ]; then
            python3 conformance/slim/bootstrap_response_diagnostic.py conformance/slim/access_onboarding.py --bin bin
          elif [ '${{ matrix.suite }}' = 'machine_owner' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/machine_owner_lifecycle_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'owner_finalization' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/owner_finalization_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'machine_requester_completion' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/machine_requester_completion_clock_prerequisite.py --bin bin
          elif [[ '${{ matrix.suite }}' == runtime* ]]; then
            python3 conformance/slim/${{ matrix.suite }}.py --bin bin
          else
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/${{ matrix.suite }}.py --bin bin
          fi

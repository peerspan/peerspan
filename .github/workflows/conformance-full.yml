name: Conformance (full)

# The second tier (DEC-OWN15): the per-section guided onboarding suites and the
# installed bundle, upgrade and participant checks. It runs nightly, by hand,
# and on a pull request labelled full-conformance; the per-push tier is
# conformance.yml.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: conformance-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-conformance')
    name: Build host, peer probe and helper
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Build
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust/Cargo.toml --bin peerspan-host --bin peerspan-peer-probe --bin peerspan-helper
          mkdir -p bin
          cp rust/target/debug/peerspan-host rust/target/debug/peerspan-peer-probe rust/target/debug/peerspan-helper bin/
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-binaries
          path: bin/
          retention-days: 1
          if-no-files-found: error

  suite:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-conformance')
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [completion_rate_limit, project_onboarding, adapter_onboarding, invitation_onboarding, join_onboarding, owner_onboarding, owner_signing, admission_onboarding, admission_consent, admission_retained_prefix, incoming_progress, owner_finalization, owner_finalization_signing, requester_commit, requester_completion, access_onboarding, access_consent, access_signing, access_application, readiness, peer_reachability, machine_owner, machine_owner_consent, machine_return_prepare, machine_owner_signing, machine_requester_inspection, machine_requester_consent, machine_requester_completion]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resource-helper test dependencies
        if: matrix.suite == 'machine_return_prepare'
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: -r conformance/slim/resource_mailbox_gate.requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: conformance-binaries
          path: bin
      - name: Run ${{ matrix.suite }}
        run: |
          set -euo pipefail
          chmod +x bin/*
          if [ '${{ matrix.suite }}' = 'machine_requester_inspection' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/inspection_finalization_diagnostic.py --bin bin
          elif [ '${{ matrix.suite }}' = 'owner_onboarding' ] || [ '${{ matrix.suite }}' = 'owner_signing' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/owner_publication_prerequisite.py '${{ matrix.suite }}' --bin bin
          elif [ '${{ matrix.suite }}' = 'join_onboarding' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/join_onboarding_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'requester_commit' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/requester_commit_prefix_diagnostic.py --bin bin
          elif [ '${{ matrix.suite }}' = 'requester_completion' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/requester_completion_barrier_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'machine_requester_consent' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/machine_requester_consent_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'access_onboarding' ]; then
            python3 conformance/slim/bootstrap_response_diagnostic.py conformance/slim/access_onboarding.py --bin bin
          elif [ '${{ matrix.suite }}' = 'machine_owner' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/machine_owner_lifecycle_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'owner_finalization' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/owner_finalization_prerequisite.py --bin bin
          elif [ '${{ matrix.suite }}' = 'machine_requester_completion' ]; then
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/machine_requester_completion_clock_prerequisite.py --bin bin
          else
            python3 conformance/slim/link_response_diagnostic.py conformance/slim/${{ matrix.suite }}.py --bin bin
          fi

  onboarding-bundle:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-conformance')
    name: Installed onboarding bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DISABLE_UPDATES: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install pinned native CLI
        run: npm install --prefix "$RUNNER_TEMP/peerspan-claude-bundle" --no-audit --no-fund --save-exact @anthropic-ai/claude-code@2.1.303
      - name: Check packaging boundaries
        run: |
          set -euo pipefail
          python conformance/test_package_release.py
          python conformance/test_onboarding_package.py
      - name: Build and check the installed archive
        run: |
          set -euo pipefail
          bundle_version="$(python -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"])')-ci"
          scripts/package-release.sh rust "$bundle_version" dist
          archive="dist/peerspan-${bundle_version}-linux-amd64-rust.tar.gz"
          (cd dist && sha256sum -c "$(basename "$archive").sha256")
          python conformance/installed_bundle.py --archive "$archive" --node "$(command -v node)"
          python conformance/onboarding_bundle.py --archive "$archive" \
            --claude "$RUNNER_TEMP/peerspan-claude-bundle/node_modules/.bin/claude"
      - name: Install terminal acceptance dependency
        run: python -m pip install --disable-pip-version-check -r conformance/requirements-terminal.txt
      - name: Exercise the actual installed terminal
        id: terminal-acceptance
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python conformance/installed_terminal.py --archive "$archive" \
            --claude "$RUNNER_TEMP/peerspan-claude-bundle/node_modules/.bin/claude" \
            --work "$RUNNER_TEMP/peerspan-terminal-acceptance"
      - name: Check out genuine common schema23 source
        uses: actions/checkout@v4
        with:
          ref: 2719d9978ddb86fba003675217fd04922de77a9f
          path: acceptance-sources/old23
          persist-credentials: false
      - name: Check out genuine main schema24 source
        uses: actions/checkout@v4
        with:
          ref: 7d675b6f80304c82e1ad3162b94e5ba305ecdffb
          path: acceptance-sources/main24
          persist-credentials: false
      - name: Check out genuine feature schema27 source
        uses: actions/checkout@v4
        with:
          ref: a214ec687d820689269be95c5e31fb6001a443a3
          path: acceptance-sources/feature27
          persist-credentials: false
      - name: Build genuine old binaries and verify complete upgrade and restore
        id: upgrade-acceptance
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/peerspan-old-target
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/peerspan-old-binaries"
          for history in old23 main24 feature27; do
            manifest="acceptance-sources/$history/rust/Cargo.toml"
            # Shared worktrees have the same package identity. Clear only this
            # package so mtime-based reuse cannot substitute another history.
            cargo clean --manifest-path "$manifest" -p peerspan-host
            cargo build --locked --manifest-path "$manifest" --bin peerspan-host
            cp "$CARGO_TARGET_DIR/debug/peerspan-host" "$RUNNER_TEMP/peerspan-old-binaries/$history"
          done
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python conformance/installed_upgrade.py --archive "$archive" \
            --old23 "$RUNNER_TEMP/peerspan-old-binaries/old23" \
            --main24 "$RUNNER_TEMP/peerspan-old-binaries/main24" \
            --feature27 "$RUNNER_TEMP/peerspan-old-binaries/feature27" \
            --work "$RUNNER_TEMP/peerspan-upgrade-acceptance"
      - name: Verify installed participant flows and receiver enforcement
        id: participant-acceptance
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/peerspan-old-target
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          cargo clean --manifest-path rust/Cargo.toml -p peerspan-host
          cargo build --locked --manifest-path rust/Cargo.toml --bin peerspan-peer-probe
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          python conformance/installed_participants.py --archive "$archive" --sha256 "$archive_sha" \
            --probe "$CARGO_TARGET_DIR/debug/peerspan-peer-probe" --suite all \
            --work-dir "$RUNNER_TEMP/peerspan-participant-acceptance"
      - name: Retain sanitized acceptance evidence on every outcome
        if: always()
        env:
          TERMINAL_OUTCOME: ${{ steps.terminal-acceptance.outcome }}
          UPGRADE_OUTCOME: ${{ steps.upgrade-acceptance.outcome }}
          PARTICIPANT_OUTCOME: ${{ steps.participant-acceptance.outcome }}
        run: |
          set -euo pipefail
          python conformance/acceptance_receipts.py \
            --terminal-work "$RUNNER_TEMP/peerspan-terminal-acceptance" \
            --upgrade-work "$RUNNER_TEMP/peerspan-upgrade-acceptance" \
            --participants-work "$RUNNER_TEMP/peerspan-participant-acceptance" \
            --archive-dir dist --output "$RUNNER_TEMP/peerspan-acceptance-public"
          python - <<'PY'
          import json, os
          from pathlib import Path
          values = {key: os.environ.get(key, '') for key in
                    ('TERMINAL_OUTCOME', 'UPGRADE_OUTCOME', 'PARTICIPANT_OUTCOME')}
          allowed = {'success', 'failure', 'cancelled', 'skipped', ''}
          assert all(value in allowed for value in values.values())
          values['candidate_sha'] = os.environ['GITHUB_SHA']
          destination = Path(os.environ['RUNNER_TEMP']) / 'peerspan-acceptance-public/gate-outcomes.json'
          destination.write_text(json.dumps(values, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-acceptance-receipts
          path: ${{ runner.temp }}/peerspan-acceptance-public/*.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-onboarding-bundle
          path: dist/*.tar.gz*
          retention-days: 1
          if-no-files-found: ignore

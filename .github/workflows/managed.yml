name: Managed operator
on:
  push:
    paths: ['managed/**', 'docs/managed-contract.md', '.github/workflows/managed.yml']
  pull_request:
    paths: ['managed/**', 'docs/managed-contract.md', '.github/workflows/managed.yml']
permissions:
  contents: read
jobs:
  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix managed run check
      - run: node managed/conformance/acceptance.mjs
      - run: node managed/conformance/operations.mjs
      - run: node managed/conformance/visibility.mjs
      - run: node managed/conformance/remote.mjs
      - run: node managed/conformance/schedules.mjs
      - run: node managed/conformance/reviewers.mjs

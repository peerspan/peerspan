name: Coordinator-free two-person linking

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: decentralized-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  two-people:
    name: Two people, two hosts, no coordinator (${{ matrix.implementation }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        implementation: [go, rust]
    env:
      CARGO_INCREMENTAL: '0'
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        if: matrix.implementation == 'rust'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build host and peer probe from this checkout
        env:
          IMPLEMENTATION: ${{ matrix.implementation }}
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$EXPECTED_SOURCE" ]]
          mkdir -p "$RUNNER_TEMP/dec-bin" "$RUNNER_TEMP/dec-receipts"
          CGO_ENABLED=0 go -C go build -o "$RUNNER_TEMP/dec-bin/peerspan-peer-probe" ./cmd/peerspan-peer-probe
          if [[ $IMPLEMENTATION == go ]]; then
            CGO_ENABLED=0 go -C go build -o "$RUNNER_TEMP/dec-bin/peerspan-host" ./cmd/peerspan-host
          else
            cargo build --locked --manifest-path rust/Cargo.toml --bin peerspan-host
            cp rust/target/debug/peerspan-host "$RUNNER_TEMP/dec-bin/"
          fi
          git diff --exit-code
          {
            git rev-parse HEAD
            sha256sum "$RUNNER_TEMP/dec-bin/peerspan-host" "$RUNNER_TEMP/dec-bin/peerspan-peer-probe"
            sha256sum conformance/decentralized_native_introduction.py conformance/decentralized_native_introduction_cases.json
          } > "$RUNNER_TEMP/dec-receipts/source-and-artifacts.txt"
      - name: Run all five fresh native introduction cases
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d /tmp/pdec.XXXXXX)
          mkdir -p "$fixture_root/tmp"
          export TMPDIR="$fixture_root/tmp"
          python conformance/decentralized_native_introduction.py \
            --host "$RUNNER_TEMP/dec-bin/peerspan-host" \
            --probe "$RUNNER_TEMP/dec-bin/peerspan-peer-probe" \
            --source "$(git rev-parse HEAD)" --final-head \
            --work-dir "$fixture_root/cases" \
            --results "$RUNNER_TEMP/dec-receipts/results.json"
      - name: Retain only public receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decentralized-link-${{ matrix.implementation }}-${{ env.EXPECTED_SOURCE }}
          path: |
            ${{ runner.temp }}/dec-receipts/source-and-artifacts.txt
            ${{ runner.temp }}/dec-receipts/results.json
          if-no-files-found: warn

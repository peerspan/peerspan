name: Pull request checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go race, vet and build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Existing Go tests with race detection
        run: go -C go test -race ./internal/... ./cmd/...
      - name: Go vet
        run: go -C go vet ./internal/... ./cmd/...
      - name: Build all shipped Go commands
        run: go -C go build ./cmd/...

  rust:
    name: Rust format, tests, Clippy and build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Rust format
        run: cargo fmt --check --manifest-path rust/Cargo.toml
      - name: Existing Rust tests
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Rust Clippy
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Build shipped Rust binaries
        run: cargo build --locked --manifest-path rust/Cargo.toml --bins

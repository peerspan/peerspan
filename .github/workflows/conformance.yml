name: Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build host and peer probe
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Build
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path rust/Cargo.toml --bin peerspan-host --bin peerspan-peer-probe
          mkdir -p bin
          cp rust/target/debug/peerspan-host rust/target/debug/peerspan-peer-probe bin/
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-binaries
          path: bin/
          retention-days: 1
          if-no-files-found: error

  suite:
    name: ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # capabilities runs as two parallel jobs so each stays under 2 minutes: capabilities-sources takes the
        # remote MCP server and gh cases after its own setup.
        include:
          - {name: join, suite: join, args: ''}
          - {name: renewal, suite: renewal, args: ''}
          - {name: policy, suite: policy, args: ''}
          - {name: sync, suite: sync, args: ''}
          - {name: work, suite: work, args: ''}
          - {name: capabilities, suite: capabilities, args: '--skip remote_mcp_server --skip gh_builtin_source'}
          - name: capabilities-sources
            suite: capabilities
            args: '--only setup_and_source_snapshot --only remote_mcp_server --only gh_builtin_source'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: conformance-binaries
          path: bin
      - name: Run ${{ matrix.name }}
        run: |
          set -euo pipefail
          chmod +x bin/*
          python3 conformance/slim/${{ matrix.suite }}.py --bin bin ${{ matrix.args }}

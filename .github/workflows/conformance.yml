name: Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build host, peer probe and helper
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: |
          set -euo pipefail
          cargo build --locked --bin peerspan-host --bin peerspan-peer-probe --bin peerspan-helper
          mkdir -p bin
          cp target/debug/peerspan-host target/debug/peerspan-peer-probe target/debug/peerspan-helper bin/
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-binaries
          path: bin/
          retention-days: 1
          if-no-files-found: error

  suite:
    name: ${{ matrix.suite }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The per-push tier (DEC-OWN15): one suite per spec area, plus the
        # owner-local and combined guided onboarding suites. The other guided
        # suites and the installed checks are in conformance-full.yml.
        suite: [join, renewal, policy, sync, work, capabilities, delivery, root, live, basics, onboarding, guided_machine, conversations, conversations_people, conversations_sync, conversations_context, conversations_tools, conversations_run_fixes, naming]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: conformance-binaries
          path: bin
      - name: Run ${{ matrix.suite }}
        run: |
          set -euo pipefail
          chmod +x bin/*
          python3 conformance/slim/link_response_diagnostic.py conformance/slim/${{ matrix.suite }}.py --bin bin

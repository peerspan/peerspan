# Litestream configuration replicating the coordinator database to an
# S3-compatible bucket. Written for Litestream v0.5.17; install as
# /etc/peerspan-coord/litestream.yml (root:root, mode 0644).
#
# Litestream expands ${VAR} references from its environment, which
# litestream.service reads from /etc/peerspan-coord/litestream.env. The
# credentials, LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY, are
# read from that environment directly and never appear here.
#
# Encryption at rest: Litestream v0.5 has no client-side encryption (its age
# support was removed), so replicas use S3 server-side encryption with a
# customer-provided key (SSE-C). The storage provider encrypts every object
# with the key sent on each request and does not store the key; without it
# nothing in the bucket can be read, restores included. Keep a copy of the key
# offline beside the offline backup file (README.md). The bucket must also be
# private.
dbs:
  - path: /var/lib/peerspan-coord/coord.db
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: ${LITESTREAM_PATH}
      endpoint: ${LITESTREAM_ENDPOINT}
      region: ${LITESTREAM_REGION}
      sync-interval: 1s
      # A file holding the base64-encoded 256-bit key, readable only by the
      # peerspan-coord user.
      sse-customer-key-path: /etc/peerspan-coord/litestream-sse.key
      sse-customer-algorithm: AES256

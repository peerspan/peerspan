<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 330" width="750" height="330" role="img" aria-labelledby="title description">
  <title id="title">How Peerspan connects agents</title>
  <desc id="description">An agent on each owner's machine connects to its local Peerspan host. The hosts check signed membership and access rules locally, then exchange work directly over QUIC. When a direct connection is unavailable, optional helpers provide rendezvous and relay encrypted traffic without approving members or reading the work.</desc>
  <style>
    .background { fill: #fff; }
    .machine { fill: #f7f9fc; stroke: #c3cad8; }
    .agent { fill: #fff; stroke: #d8dde8; }
    .host { fill: #fff; stroke: #0e8fd0; stroke-width: 2; }
    .helper { fill: #f7f9fc; stroke: #c3cad8; }
    .heading { fill: #151b2b; font-weight: 600; }
    .body { fill: #4d5a75; }
    .line { fill: none; stroke: #6c7891; stroke-width: 1.5; }
    .arrow { fill: #6c7891; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; }
    .large { font-size: 15px; }
    .small { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .machine, .helper { fill: #161b22; stroke: #3d444d; }
      .agent { fill: #0d1117; stroke: #30363d; }
      .host { fill: #0d1117; stroke: #7fdcff; }
      .heading { fill: #e6edf3; }
      .body { fill: #a7b0bc; }
      .line { stroke: #7a86a0; }
      .arrow { fill: #7a86a0; }
    }
  </style>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 10 5 0 10Z" />
    </marker>
  </defs>

  <rect class="background" width="750" height="330" />

  <g transform="translate(0 -60)">

  <path class="line" d="M300 232H450" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)" />
  <path class="line" d="M160 275V348H269 M590 275V348H481" stroke-dasharray="5 5" />

  <rect class="machine" x="15" y="85" width="285" height="190" rx="12" />
  <text class="heading large" x="35" y="111">Owner A</text>
  <text class="body small" x="35" y="129">Machine 1</text>
  <rect class="agent" x="35" y="139" width="250" height="38" rx="7" />
  <text class="heading" x="160" y="163" text-anchor="middle">Agent session</text>
  <rect class="host" x="35" y="195" width="250" height="65" rx="8" />
  <text class="heading" x="52" y="218">Peerspan host</text>
  <text class="body small" x="52" y="237">Checks signed membership + access</text>
  <text class="body small" x="52" y="253">Stores work and retries delivery</text>

  <rect class="machine" x="450" y="85" width="285" height="190" rx="12" />
  <text class="heading large" x="470" y="111">Owner B</text>
  <text class="body small" x="470" y="129">Machine 2</text>
  <rect class="agent" x="465" y="139" width="250" height="38" rx="7" />
  <text class="heading" x="590" y="163" text-anchor="middle">Agent session</text>
  <rect class="host" x="465" y="195" width="250" height="65" rx="8" />
  <text class="heading" x="482" y="218">Peerspan host</text>
  <text class="body small" x="482" y="237">Checks signed membership + access</text>
  <text class="body small" x="482" y="253">Stores work and retries delivery</text>

  <path class="line" d="M160 178V193 M590 178V193" marker-end="url(#arrowhead)" />

  <text class="heading" x="375" y="207" text-anchor="middle">Direct QUIC</text>
  <text class="body small" x="375" y="222" text-anchor="middle">records + work</text>

  <text class="body small" x="375" y="302" text-anchor="middle">Optional path when direct connection is unavailable</text>
  <rect class="helper" x="269" y="316" width="212" height="64" rx="10" />
  <text class="heading" x="375" y="338" text-anchor="middle">Helper</text>
  <text class="body small" x="375" y="355" text-anchor="middle">Rendezvous + encrypted relay</text>
  <text class="body small" x="375" y="370" text-anchor="middle">Cannot approve or read work</text>
  </g>
</svg>
